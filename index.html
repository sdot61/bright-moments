<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bright Moments | Mosaics</title><meta name="description" content="Bright Moments mosaic store and gallery"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet"><style>:root{--ink:#302c2b;--rose:#e9a4a9;--coral:#f2a277;--sun:#f2d36b;--sage:#b6d6a0;--lilac:#c9b4dc;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{text-align:center;padding:62px 20px 34px}.logo{margin:0;font-size:clamp(3.2rem,9vw,8rem);font-family:"Bree Serif",Georgia,serif;letter-spacing:-.025em;line-height:1.08;font-weight:400;text-transform:none;color:#111}.subtitle{margin:15px 0 0;text-transform:uppercase;letter-spacing:.26em;font-size:11px;font-weight:700}.brand-banner{max-width:960px;margin:30px auto 0}.brand-banner img{display:block;width:100%;height:auto;object-fit:contain}main{max-width:1350px;margin:auto;padding:0 30px 100px}.tabs{display:flex;justify-content:center;width:max-content;max-width:100%;margin-left:auto;margin-right:auto}.tabs button{border:0;border-radius:0;cursor:pointer;color:#292525;font-weight:700;transition:filter .12s}.tabs button:hover{filter:brightness(.96)}.tabs button:focus-visible{outline:3px solid #292525;outline-offset:3px}.tabs button[aria-selected=true]{box-shadow:inset 0 -4px 0 #342d2a}.primary{margin-top:15px}.primary button{font-size:19px;min-width:230px;padding:18px 30px}.primary [data-section=store]{background:var(--rose)}.primary [data-section=gallery]{background:var(--sun)}.era{margin-top:0}.era[hidden]{display:none}.era button{font-size:12px;letter-spacing:.07em;padding:13px 24px;min-width:150px}.era [data-era=new]{background:#c9b4dc}.era [data-era=older]{background:#b6d6a0}.secondary{margin-top:0;margin-bottom:40px}.secondary button{font-size:17px;letter-spacing:.04em;text-transform:uppercase;min-width:125px;padding:17px 22px}.secondary [data-category=all]{background:var(--sage)}.secondary [data-category=art]{background:var(--coral)}.secondary [data-category=coasters]{background:var(--lilac)}.secondary [data-category=mirrors]{background:var(--rose)}.secondary [data-category=jewelry]{background:var(--sun)}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:45px 22px}.item{min-width:0}.photo{width:100%;background:#faf8f5;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5}.photo img{width:100%;height:100%;object-fit:contain;display:block}.item-title{font-size:13px;font-weight:700;margin:13px 0 0}.item-type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#716966;margin:6px 0 0}.buy{display:block;width:100%;margin-top:13px;padding:14px;background:#302c2b;color:#fff;border:0;font-weight:700;cursor:pointer}.buy:hover{background:#a54e58}.empty{text-align:center;grid-column:1/-1;padding:65px 15px;color:#655b58;font-size:15px}footer{text-align:center;padding:25px;color:#776c67;text-transform:uppercase;letter-spacing:.14em;font-size:10px}@media(max-width:800px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.primary button{min-width:160px}}.hero{max-width:960px;margin:0 auto;position:relative}.brand-banner{margin:0}.hero .desktop-nav{position:absolute;left:0;right:0;bottom:0}.hero .primary{margin:0;width:100%;display:flex}.hero .primary button{flex:1;min-width:0;font-size:clamp(21px,3vw,33px);padding:20px 25px;background:rgba(233,164,169,.94)}.hero .primary [data-section=gallery]{background:rgba(242,211,107,.94)}.subnav{display:none;margin:0 auto 40px}.subnav.expanded{display:block}.subnav .secondary{margin-bottom:0}.subnav .era{margin-bottom:0}.mobile-selects{display:none}@media(max-width:560px){.primary button{min-width:120px;padding:15px}.secondary button{min-width:0;padding:12px 15px;font-size:14px}.items{grid-template-columns:1fr}}</style></head><body><header><h1 class="logo">Bright Moments Mosaics</h1><p class="subtitle">Mosaic art &amp; objects</p></header><div class="hero"><div class="brand-banner"><img src="IMG_20211122_100303096.jpg" alt="Bright Moments mosaic banner"></div><div class="desktop-nav"><nav class="tabs primary" aria-label="Store or gallery"><button type="button" data-section="store" aria-selected="false">Store</button><button type="button" data-section="gallery" aria-selected="true">Gallery</button></nav></div></div><main><div class="subnav"><nav class="tabs secondary" aria-label="Categories"><button type="button" data-category="all" aria-selected="true">All</button><button type="button" data-category="art" aria-selected="false">Art</button><button type="button" data-category="coasters" aria-selected="false">Coasters</button><button type="button" data-category="mirrors" aria-selected="false">Mirrors</button><button type="button" data-category="jewelry" aria-selected="false">Jewelry</button></nav></div><section id="items" class="items" aria-label="Mosaics"></section></main><footer>Bright Moments · Handmade mosaics</footer><script>let products=[];
const repoTree="https://api.github.com/repos/sdot61/bright-moments/git/trees/main?recursive=1";
const categoryNames=["art","coasters","mirrors","jewelry"];
async function loadProducts(){try{const response=await fetch(repoTree,{headers:{Accept:"application/vnd.github+json"}});if(!response.ok)throw Error("Repository listing unavailable");const data=await response.json();if(data.truncated)throw Error("Repository listing incomplete");products=(data.tree||[]).filter(f=>f.type==="blob"&&f.size>100&&/\.(jpe?g|png|webp|gif|avif)$/i.test(f.path)).map(f=>{const parts=f.path.split("/");if(parts.length<3)return null;const section=parts[0].toLowerCase();const category=parts[1].toLowerCase();if(!["gallery","store"].includes(section)||!categoryNames.includes(category))return null;const filename=parts[parts.length-1];const era=parts.slice(2,-1).some(x=>x.toLowerCase()==="new")?"new":"older";return {file:parts.map(encodeURIComponent).join("/"),title:filename.replace(/\.[^.]+$/,"").replace(/[_-]+/g," "),category,section,era}}).filter(Boolean);render()}catch(e){console.warn("Could not load repository images",e);items.replaceChildren();const p=document.createElement("p");p.className="empty";p.textContent="Images could not be loaded. Please refresh the page.";items.append(p)}}
const items=document.getElementById("items");let section="gallery",category="all";
function render(){const shown=products.filter(p=>p.section===section&&(category==="all"||p.category===category));items.replaceChildren();if(!shown.length){const empty=document.createElement("p");empty.className="empty";empty.textContent=section==="store"?"Store items are coming soon.":"No pieces in this selection yet.";items.append(empty);return}for(const p of shown){const article=document.createElement("article");article.className="item";const photo=document.createElement("div");photo.className="photo";const img=document.createElement("img");img.src=p.file;img.alt=p.title;img.loading="lazy";photo.append(img);const name=document.createElement("h2");name.className="item-title";name.textContent=p.title;article.append(photo,name);if(section==="store"){const buy=document.createElement("button");buy.className="buy";buy.textContent="Price TBC · Buy";buy.addEventListener("click",()=>alert("Checkout is not available yet."));article.append(buy)}items.append(article)}}document.querySelectorAll("[data-section]").forEach(button=>{const change=()=>{section=button.dataset.section;category="all";document.querySelector(".subnav").classList.add("expanded");document.querySelectorAll("[data-section]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.section===section)));document.querySelectorAll("[data-category]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.category===category)));render()};button.addEventListener("mouseenter",change);button.addEventListener("click",change)});document.querySelectorAll("[data-category]").forEach(button=>{const change=()=>{category=button.dataset.category;document.querySelectorAll("[data-category]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.category===category)));render()};button.addEventListener("mouseenter",change);button.addEventListener("click",change)});document.querySelector(".subnav").addEventListener("mouseleave",()=>{document.querySelector(".subnav").classList.remove("expanded")});loadProducts();</script></body></html>
