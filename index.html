<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bright Moments | Mosaics</title><meta name="description" content="Bright Moments mosaic store and gallery"><style>:root{--navy:#3D4F90;--comic:"Comic Sans MS","Comic Sans",cursive;--ink:#3D4F90;--rose:#e9a4a9;--coral:#f2a277;--sun:#f2d36b;--sage:#b6d6a0;--lilac:#c9b4dc;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:"Comic Sans MS","Comic Sans",cursive;font-weight:700}header{text-align:center;padding:62px 20px 34px}.brand-link{display:inline-block;text-decoration:none;color:inherit;cursor:pointer}.brand-link:focus-visible{outline:2px solid var(--ink);outline-offset:6px}.logo{margin:0;font-size:clamp(2.9rem,8vw,7rem);font-family:"Comic Sans MS","Comic Sans",cursive;letter-spacing:-.025em;line-height:1.08;font-weight:700;text-transform:none;color:#3D4F90}.subtitle{color:#3D4F90;margin:15px 0 0;text-transform:uppercase;letter-spacing:.16em;font-size:20px;font-weight:700}.brand-banner{max-width:960px;margin:30px auto 0}.brand-banner img{display:block;width:100%;height:auto;object-fit:contain}main{max-width:1350px;margin:auto;padding:55px 30px 100px}.tabs{display:flex;justify-content:center;width:max-content;max-width:100%;margin-left:auto;margin-right:auto}.tabs button{font-family:"Comic Sans MS","Comic Sans",cursive;border:0;border-radius:0;cursor:pointer;color:#fff;font-weight:700;transition:filter .12s}.tabs button:hover{filter:brightness(.96)}.tabs button:focus-visible{outline:3px solid #292525;outline-offset:3px}.tabs button[aria-selected=true]{box-shadow:none}.primary{margin-top:15px}.primary button{font-size:19px;min-width:230px;padding:18px 30px}.primary [data-section=store]{background:var(--rose)}.primary [data-section=gallery]{background:var(--sun)}.era{margin-top:0}.era[hidden]{display:none}.era button{font-size:12px;letter-spacing:.07em;padding:13px 24px;min-width:150px}.era [data-era=new]{background:#c9b4dc}.era [data-era=older]{background:#b6d6a0}.secondary{margin-top:0;margin-bottom:40px;flex-wrap:wrap}.secondary button{font-size:17px;letter-spacing:.04em;text-transform:uppercase;min-width:125px;padding:17px 22px}.secondary [data-category=all]{background:var(--sage)}.secondary [data-category=art]{background:var(--coral)}.secondary [data-category=coasters]{background:var(--lilac)}.secondary [data-category=mirrors]{background:var(--rose)}.secondary [data-category=jewelry]{background:var(--sun)}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:45px 22px}.item{min-width:0}.photo{width:100%;background:#fff;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .12s;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5}.item:hover .photo,.item:focus-within .photo{outline-color:#111}.photo img{width:100%;height:100%;object-fit:contain;display:block}.item-title{font-size:19px;font-weight:700;margin:13px 0 0}.item-type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#3D4F90;margin:6px 0 0}.buy{display:block;width:100%;margin-top:13px;padding:14px;background:var(--sage);color:var(--navy);border:0;font-weight:700;cursor:pointer}.buy:hover{background:#a54e58}.empty{text-align:center;grid-column:1/-1;padding:65px 15px;color:#3D4F90;font-size:15px}footer{text-align:center;padding:25px;color:#3D4F90;text-transform:uppercase;letter-spacing:.14em;font-size:10px}@media(max-width:800px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.primary button{min-width:160px}}.hero{max-width:960px;margin:0 auto;position:relative}.brand-banner{margin:0}.hero .desktop-nav{position:absolute;left:0;right:0;bottom:0}.hero .primary{margin:0;width:100%;display:flex;justify-content:space-between}.hero .primary button{flex:0 0 33.333333%;min-width:0;font-size:clamp(21px,3vw,33px);padding:20px 25px;background:rgba(233,164,169,.94)}.hero .primary [data-section=gallery]{background:rgba(242,211,107,.94)}.subnav{display:none;margin:24px auto 40px}.subnav.expanded{display:block}.subnav .secondary{margin-bottom:0}.subnav .era{margin-bottom:0}.mobile-selects{display:none}@media(max-width:560px){.hero .primary button{padding:12px 8px;font-size:20px}.secondary{flex-wrap:wrap}.secondary button{min-width:0;padding:12px 15px;font-size:14px}.items{grid-template-columns:1fr}}
/* Navy lettering for site text; keep all navigation tabs and buttons white. */
body,input,select,textarea{font-family:var(--comic);color:var(--navy)}
.logo,.subtitle,.item-title,.item-type,.empty,footer{color:var(--navy)}
a,a:visited{color:var(--navy)}
button,.tabs button,.hero .primary button,.buy{font-family:var(--comic);color:#fff}

/* The title always links home; only verified editors see the subtle return shortcut. */
.brand-heading-wrap{display:inline-flex;flex-direction:column;align-items:stretch;max-width:100%}
.brand-heading-wrap>.brand-link{display:block;text-align:center}
.brand-edit-link{align-self:flex-end;margin-top:6px;padding:3px 8px;border:1px solid var(--navy);border-radius:3px;background:#fff;font-family:var(--comic);font-weight:700;font-size:11px;line-height:1.25;text-decoration:none;color:var(--navy);letter-spacing:0;text-transform:none}
.brand-edit-link:hover{background:#eef1f9}
.brand-edit-link:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

</style></head><body><header><a id="brandNavigation" class="brand-link" href="./" aria-label="Bright Moments Mosaics home"><h1 class="logo">Bright Moments Mosaics</h1><p class="subtitle">Mosaic art &amp; objects</p></a></header><div class="hero"><div class="brand-banner"><img src="https://raw.githubusercontent.com/sdot61/bright-moments/main/IMG_20240513_111051154_HDR.jpg" alt="Bright Moments mosaic banner" onerror="this.onerror=null;this.src='IMG_20240513_111051154_HDR.jpg'"></div><div class="desktop-nav"><nav class="tabs primary" aria-label="Store or gallery"><button type="button" data-section="store" aria-selected="false">Store</button><button type="button" data-section="gallery" aria-selected="true">Gallery</button></nav></div></div><main><div class="subnav"><nav class="tabs secondary" aria-label="Categories"><button type="button" data-category="all" aria-selected="true">All</button><button type="button" data-category="art" aria-selected="false">Art</button><button type="button" data-category="coasters" aria-selected="false">Coasters</button><button type="button" data-category="mirrors" aria-selected="false">Mirrors</button><button type="button" data-category="jewelry" aria-selected="false">Jewelry</button></nav></div><section id="items" class="items" aria-label="Mosaics"></section></main><footer>Bright Moments · Handmade mosaics</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="brand-navigation.js?v=20261027-home-edit-shortcut-1"></script><script>let products=[];
const repoTree="https://api.github.com/repos/sdot61/bright-moments/git/trees/main?recursive=1";
let categoryNames=["art","coasters","mirrors","jewelry"];

async function loadCategoryTabs(){
 const c=window.BRIGHT_MOMENTS_SUPABASE||{};
 if(!c.url||!c.publishableKey||!window.supabase)return;
 try{
  const client=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'bright-moments-public-gallery'}});
  const {data,error}=await client.from('gallery_categories').select('slug,label,color').order('sort_order').order('label');
  if(error)throw error;
  categoryNames=(data||[]).map(p=>p.slug);
  // A deleted category can no longer remain selected on the public website.
  if(category!=='all'&&!categoryNames.includes(category))category='all';
  const nav=document.querySelector('.tabs.secondary');
  nav.replaceChildren();
  const entries=[{slug:'all',label:'All',color:'#b6d6a0'},...(data||[])];
  for(const entry of entries){
   const button=document.createElement('button');button.type='button';
   button.dataset.category=entry.slug;button.textContent=entry.label;
   button.style.backgroundColor=/^#[0-9a-fA-F]{6}$/.test(entry.color)?entry.color:'#b6d6a0';
   button.setAttribute('aria-selected',String(entry.slug===category));
   const change=()=>{
    category=button.dataset.category;
    nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.category===category)));
    render();
   };
   button.addEventListener('mouseenter',change);
   button.addEventListener('click',change);
   nav.append(button);
  }
 }catch(error){console.warn('Unable to load new category tabs. Keeping the existing tabs.',error)}
}
async function loadProducts(){
 await loadCategoryTabs();
 try{
  const managed=await loadManagedPhotos();
  if(!managed)throw Error('Gallery connection is not configured.');
  // Once Supabase manages published photos, never revive deleted GitHub listings.
  products=managed.photos;
  render();
 }catch(error){
  console.warn('Managed gallery unavailable',error);
  if(!products.length){
   items.replaceChildren();
   const message=document.createElement('p');
   message.className='empty';
   message.textContent='The gallery is temporarily unavailable. Please try again shortly.';
   items.append(message);
  }
 }
}
async function loadManagedPhotos(){
 const c=window.BRIGHT_MOMENTS_SUPABASE||{};
 if(!c.url||!c.publishableKey||!window.supabase)return null;
 const client=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'bright-moments-public-gallery'}});
 const [settings,records]=await Promise.all([
 client.from("gallery_settings").select("migrated").eq("id",1).maybeSingle(),
 client.from("gallery_images").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true})
 ]);
 if(settings.error)throw settings.error;
 if(records.error)throw records.error;
 return {migrated:!!settings.data?.migrated,photos:(records.data||[]).map(p=>({
 file:p.file_path.startsWith("github:")?"https://raw.githubusercontent.com/sdot61/bright-moments/main/"+p.file_path.slice(7).split("/").map(encodeURIComponent).join("/"):client.storage.from("bright-moments-images").getPublicUrl(p.file_path).data.publicUrl,
 title:p.title,category:p.category,section:p.section,managed:true
 }))};
}
const items=document.getElementById("items");let section="gallery",category="all";
const requestedSection=new URLSearchParams(window.location.search).get('section');
if(requestedSection==='store'||requestedSection==='gallery'){
 section=requestedSection;
 document.querySelector('.subnav').classList.add('expanded');
 document.querySelectorAll('[data-section]').forEach(button=>{
  button.setAttribute('aria-selected',String(button.dataset.section===section));
 });
}
function render(){const shown=products.filter(p=>p.section===section&&(category==="all"||p.category===category));items.replaceChildren();if(!shown.length){const empty=document.createElement("p");empty.className="empty";empty.textContent=section==="store"?"Store items are coming soon.":"No pieces in this selection yet.";items.append(empty);return}for(const p of shown){const article=document.createElement("article");article.className="item";const photo=document.createElement("div");photo.className="photo";const img=document.createElement("img");img.src=p.file;img.alt=p.title;img.loading="lazy";photo.append(img);const name=document.createElement("h2");name.className="item-title";name.textContent=p.title;article.append(photo,name);if(section==="store"){const buy=document.createElement("button");buy.className="buy";buy.textContent="Price TBC · Buy";buy.addEventListener("click",()=>alert("Checkout is not available yet."));article.append(buy)}items.append(article)}}document.querySelectorAll("[data-section]").forEach(button=>{const change=()=>{section=button.dataset.section;category="all";document.querySelector(".subnav").classList.add("expanded");document.querySelectorAll("[data-section]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.section===section)));document.querySelectorAll("[data-category]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.category===category)));render()};button.addEventListener("mouseenter",change);button.addEventListener("click",change)});document.querySelectorAll("[data-category]").forEach(button=>{const change=()=>{category=button.dataset.category;document.querySelectorAll("[data-category]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.category===category)));render()};button.addEventListener("mouseenter",change);button.addEventListener("click",change)});
const liveGalleryChannel=typeof BroadcastChannel==='function'?new BroadcastChannel('bright-moments-gallery'):null;
let galleryReloadTask=null;
function queueGalleryReload(){
 if(galleryReloadTask!==null)return;
 galleryReloadTask=setTimeout(()=>{galleryReloadTask=null;loadProducts()},150);
}
liveGalleryChannel?.addEventListener('message',event=>{
 if(event.data?.type==='gallery-changed')queueGalleryReload();
});
window.addEventListener('storage',event=>{
 if(event.key==='bright-moments-gallery-updated-v1')queueGalleryReload();
});
window.addEventListener('focus',queueGalleryReload);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)queueGalleryReload()});
loadProducts();</script></body></html>
