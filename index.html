<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bright Moments | Mosaics</title><meta name="description" content="Bright Moments mosaic store and gallery"><style>:root{--navy:#3D4F90;--comic:"Comic Sans MS","Comic Sans",cursive;--ink:#3D4F90;--rose:#e9a4a9;--coral:#f2a277;--sun:#f2d36b;--sage:#b6d6a0;--lilac:#c9b4dc;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:"Comic Sans MS","Comic Sans",cursive;font-weight:700}header{text-align:center;padding:62px 20px 34px}.brand-link{display:inline-block;text-decoration:none;color:inherit;cursor:pointer}.brand-link:focus-visible{outline:2px solid var(--ink);outline-offset:6px}.logo{margin:0;font-size:clamp(2.9rem,8vw,7rem);font-family:"Comic Sans MS","Comic Sans",cursive;letter-spacing:-.025em;line-height:1.08;font-weight:700;text-transform:none;color:#3D4F90}.subtitle{color:#3D4F90;margin:15px 0 0;text-transform:uppercase;letter-spacing:.16em;font-size:20px;font-weight:700}.brand-banner{max-width:960px;margin:30px auto 0}.brand-banner img{display:block;width:100%;height:auto;object-fit:contain}main{max-width:1350px;margin:auto;padding:55px 30px 100px}.tabs{display:flex;justify-content:center;width:max-content;max-width:100%;margin-left:auto;margin-right:auto}.tabs button{font-family:"Comic Sans MS","Comic Sans",cursive;border:0;border-radius:0;cursor:pointer;color:#fff;font-weight:700;transition:filter .12s}.tabs button:hover{filter:brightness(.96)}.tabs button:focus-visible{outline:3px solid #292525;outline-offset:3px}.tabs button[aria-selected=true]{box-shadow:none}.primary{margin-top:15px}.primary button{font-size:19px;min-width:230px;padding:18px 30px}.primary [data-section=store]{background:var(--rose)}.primary [data-section=gallery]{background:var(--sun)}.era{margin-top:0}.era[hidden]{display:none}.era button{font-size:12px;letter-spacing:.07em;padding:13px 24px;min-width:150px}.era [data-era=new]{background:#c9b4dc}.era [data-era=older]{background:#b6d6a0}.secondary{margin-top:0;margin-bottom:40px;flex-wrap:wrap}.secondary button{font-size:17px;letter-spacing:.04em;text-transform:uppercase;min-width:125px;padding:17px 22px}.secondary [data-category=art]{background:var(--coral)}.secondary [data-category=coasters]{background:var(--lilac)}.secondary [data-category=mirrors]{background:var(--rose)}.secondary [data-category=jewelry]{background:var(--sun)}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:45px 22px}.item{min-width:0}.photo{width:100%;background:#fff;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .12s;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5}.item:hover .photo,.item:focus-within .photo{outline-color:#111}.photo img{width:100%;height:100%;object-fit:contain;display:block}.item-title{font-size:19px;font-weight:700;margin:13px 0 0}.item-type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#3D4F90;margin:6px 0 0}.buy{display:block;width:100%;margin-top:13px;padding:14px;background:var(--sage);color:var(--navy);border:0;font-weight:700;cursor:pointer}.buy:hover{background:#a54e58}.empty{text-align:center;grid-column:1/-1;padding:65px 15px;color:#3D4F90;font-size:15px}footer{text-align:center;padding:25px;color:#3D4F90;text-transform:uppercase;letter-spacing:.14em;font-size:10px}@media(max-width:800px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.primary button{min-width:160px}}.hero{max-width:960px;margin:0 auto;position:relative}.brand-banner{margin:0}.hero .desktop-nav{position:absolute;left:0;right:0;bottom:0}.hero .primary{margin:0;width:100%;display:flex;justify-content:space-between}.hero .primary button{flex:0 0 33.333333%;min-width:0;font-size:clamp(21px,3vw,33px);padding:20px 25px;background:rgba(233,164,169,.94)}.hero .primary [data-section=gallery]{background:rgba(242,211,107,.94)}.subnav{display:none;margin:24px auto 40px}.subnav.expanded{display:block}.subnav .secondary{margin-bottom:0}.subnav .era{margin-bottom:0}.mobile-selects{display:none}@media(max-width:560px){.hero .primary button{padding:12px 8px;font-size:20px}.secondary{flex-wrap:wrap}.secondary button{min-width:0;padding:12px 15px;font-size:14px}.items{grid-template-columns:1fr}}
/* Navy lettering for site text; keep all navigation tabs and buttons white. */
body,input,select,textarea{font-family:var(--comic);color:var(--navy)}
.logo,.subtitle,.item-title,.item-type,.empty,footer{color:var(--navy)}
a,a:visited{color:var(--navy)}
button,.tabs button,.hero .primary button,.buy{font-family:var(--comic);color:#fff}

/* The title always links home; only verified editors see the subtle return shortcut. */
.brand-heading-wrap{display:inline-flex;flex-direction:column;align-items:stretch;max-width:100%}
.brand-heading-wrap>.brand-link{display:block;text-align:center}
.brand-edit-link{align-self:flex-end;margin-top:6px;padding:3px 8px;border:1px solid var(--navy);border-radius:3px;background:#fff;font-family:var(--comic);font-weight:700;font-size:11px;line-height:1.25;text-decoration:none;color:var(--navy);letter-spacing:0;text-transform:none}
.brand-edit-link:hover{background:#eef1f9}
.brand-edit-link:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.brand-edit-link[hidden]{display:none!important}

/* Owner-managed store cart: prices stay on the website, Stripe handles payment. */
.cart-toolbar{display:flex;justify-content:flex-end;margin:-28px 0 20px}
.cart-toolbar[hidden],.cart-panel[hidden],.shop-message[hidden]{display:none!important}
#openCart,.cart-panel button,.item .buy{border-radius:5px;cursor:pointer;font-family:var(--comic);font-weight:700}
#openCart{background:var(--navy);color:white;border:0;padding:11px 18px;font-size:16px}
.cart-panel{border:2px solid var(--navy);border-radius:8px;padding:18px 20px;max-width:660px;margin:0 0 28px auto;background:#fff}
.cart-panel h2{font-size:21px;margin:0 0 13px}
.cart-panel-list{display:flex;flex-direction:column;gap:12px}
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #e1e4ef}
.cart-line-detail{display:flex;flex-direction:column;gap:4px}
.cart-line button{border:1px solid var(--navy);padding:7px 10px;background:#fff;color:var(--navy);font-size:13px}
.cart-total{font-size:19px;text-align:right;margin:16px 0}
#cartCheckout{display:block;width:100%;background:var(--navy);color:#fff;border:0;padding:13px 16px;font-size:16px}
#cartCheckout:disabled,.item .buy:disabled{opacity:.55;cursor:not-allowed}
.cart-note{font-size:12px;line-height:1.5;margin:10px 0;color:var(--navy)}
#cartMessage{min-height:1em;font-size:14px}
.shop-message{max-width:750px;margin:0 auto 20px;padding:14px;border:1px solid var(--navy);border-radius:5px;background:#eef2fc;text-align:center}
.item-price{margin:8px 0 0;font-size:17px;color:var(--navy)}
.item .buy{background:var(--navy);color:#fff}
.item .buy:not(:disabled):hover{background:#293c7c}
</style></head><body><header><a id="brandNavigation" class="brand-link" href="./" aria-label="Bright Moments Mosaics home"><h1 class="logo">Bright Moments Mosaics</h1><p class="subtitle">Mosaic art &amp; objects</p></a></header><div class="hero"><div class="brand-banner"><img src="https://raw.githubusercontent.com/sdot61/bright-moments/main/IMG_20240513_111051154_HDR.jpg" alt="Bright Moments mosaic banner" onerror="this.onerror=null;this.src='IMG_20240513_111051154_HDR.jpg'"></div><div class="desktop-nav"><nav class="tabs primary" aria-label="Store or gallery"><button type="button" data-section="store" aria-selected="false">Store</button><button type="button" data-section="gallery" aria-selected="true">Gallery</button></nav></div></div><main><div id="cartToolbar" class="cart-toolbar" hidden><button id="openCart" type="button" aria-controls="cartPanel" aria-expanded="false">Cart (0)</button></div><aside id="cartPanel" class="cart-panel" aria-label="Shopping cart" hidden><h2>Your cart · Stripe sandbox</h2><div id="cartLines" class="cart-panel-list"></div><p id="cartTotal" class="cart-total"></p><button id="cartCheckout" type="button" disabled>Test checkout with Stripe</button><p id="cartMessage" role="status" aria-live="polite"></p><p class="cart-note">TEST MODE ONLY. No real payments are processed. Prices are verified again at checkout. Shipping and taxes are not configured.</p></aside><p id="shopReturnMessage" class="shop-message" role="status" hidden></p><div class="subnav"><nav class="tabs secondary" aria-label="Categories"><button type="button" data-category="art" aria-selected="true">Art</button><button type="button" data-category="coasters" aria-selected="false">Coasters</button><button type="button" data-category="mirrors" aria-selected="false">Mirrors</button><button type="button" data-category="jewelry" aria-selected="false">Jewelry</button></nav></div><section id="items" class="items" aria-label="Mosaics"></section></main><footer>Bright Moments · Handmade mosaics</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="brand-navigation.js?v=20261027-home-edit-shortcut-1"></script><script>let products=[];
const repoTree="https://api.github.com/repos/sdot61/bright-moments/git/trees/main?recursive=1";
let categoryNames=["art","coasters","mirrors","jewelry"];

async function loadCategoryTabs(){
 const c=window.BRIGHT_MOMENTS_SUPABASE||{};
 if(!c.url||!c.publishableKey||!window.supabase)return;
 try{
  const client=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'bright-moments-public-gallery'}});
  const {data,error}=await client.from('gallery_categories').select('slug,label,color').order('sort_order').order('label');
  if(error)throw error;
  categoryNames=(data||[]).map(p=>p.slug);
  // Use the first existing category by default, or when a tab was deleted.
  if(!categoryNames.includes(category))category=categoryNames[0]||null;
  const nav=document.querySelector('.tabs.secondary');
  nav.replaceChildren();
  const entries=data||[];
  for(const entry of entries){
   const button=document.createElement('button');button.type='button';
   button.dataset.category=entry.slug;button.textContent=entry.label;
   button.style.backgroundColor=/^#[0-9a-fA-F]{6}$/.test(entry.color)?entry.color:'#b6d6a0';
   button.setAttribute('aria-selected',String(entry.slug===category));
   const change=()=>{
    category=button.dataset.category;
    nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.category===category)));
    render();
   };
   button.addEventListener('mouseenter',change);
   button.addEventListener('click',change);
   nav.append(button);
  }
 }catch(error){console.warn('Unable to load new category tabs. Keeping the existing tabs.',error)}
}
async function loadProducts(){
 await loadCategoryTabs();
 if(!category)category=categoryNames[0]||null;
 try{
  const managed=await loadManagedPhotos();
  if(!managed)throw Error('Gallery connection is not configured.');
  // Once Supabase manages published photos, never revive deleted GitHub listings.
  products=managed.photos;
  render();
 }catch(error){
  console.warn('Managed gallery unavailable',error);
  if(!products.length){
   items.replaceChildren();
   const message=document.createElement('p');
   message.className='empty';
   message.textContent='The gallery is temporarily unavailable. Please try again shortly.';
   items.append(message);
  }
 }
}
async function loadManagedPhotos(){
 const c=window.BRIGHT_MOMENTS_SUPABASE||{};
 if(!c.url||!c.publishableKey||!window.supabase)return null;
 const client=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'bright-moments-public-gallery'}});
 const [settings,records]=await Promise.all([
 client.from("gallery_settings").select("migrated").eq("id",1).maybeSingle(),
 client.from("gallery_images").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true})
 ]);
 if(settings.error)throw settings.error;
 if(records.error)throw records.error;
 return {migrated:!!settings.data?.migrated,photos:(records.data||[]).map(p=>({
 file:p.file_path.startsWith("github:")?"https://raw.githubusercontent.com/sdot61/bright-moments/main/"+p.file_path.slice(7).split("/").map(encodeURIComponent).join("/"):client.storage.from("bright-moments-images").getPublicUrl(p.file_path).data.publicUrl,
 id:p.id,title:p.title,category:p.category,section:p.section,priceCents:p.price_cents,available:p.available,managed:true
 }))};
}
const items=document.getElementById("items");let section="gallery",category=null;
const requestedSection=new URLSearchParams(window.location.search).get('section');
if(requestedSection==='store'||requestedSection==='gallery'){
 section=requestedSection;
 document.querySelector('.subnav').classList.add('expanded');
 document.querySelectorAll('[data-section]').forEach(button=>{
  button.setAttribute('aria-selected',String(button.dataset.section===section));
 });
}
function dollars(cents){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(cents/100);}
function canPurchase(photo){
 return photo&&photo.section==='store'&&photo.available===true&&
  Number.isSafeInteger(photo.priceCents)&&photo.priceCents>=50;
}
const CART_KEY='bright-moments-sandbox-cart-v1';
const cartIds=new Set();
try{
 const stored=JSON.parse(localStorage.getItem(CART_KEY)||'[]');
 if(Array.isArray(stored))stored.filter(id=>typeof id==='string').slice(0,10).forEach(id=>cartIds.add(id));
}catch(error){console.warn('Cart storage unavailable',error);}
let cartOpen=false,checkoutBusy=false;
function saveCart(){
 try{localStorage.setItem(CART_KEY,JSON.stringify([...cartIds]));}catch(error){console.warn('Could not save cart',error);}
}
function renderCart(){
 const storeItems=new Map(products.filter(canPurchase).map(p=>[p.id,p]));
 for(const id of [...cartIds])if(!storeItems.has(id))cartIds.delete(id);
 saveCart();
 const cartButton=document.getElementById('openCart');
 const panel=document.getElementById('cartPanel');
 const isStore=section==='store';
 document.getElementById('cartToolbar').hidden=!isStore;
 cartButton.textContent='Cart ('+cartIds.size+')';
 cartButton.setAttribute('aria-expanded',String(isStore&&cartOpen));
 panel.hidden=!isStore||!cartOpen;
 const list=document.getElementById('cartLines');
 list.replaceChildren();
 let total=0;
 for(const id of cartIds){
  const p=storeItems.get(id);
  if(!p)continue;
  total+=p.priceCents;
  const line=document.createElement('div');line.className='cart-line';
  const details=document.createElement('div');details.className='cart-line-detail';
  const title=document.createElement('strong');title.textContent=p.title;
  const price=document.createElement('span');price.textContent=dollars(p.priceCents);
  details.append(title,price);
  const remove=document.createElement('button');remove.type='button';remove.textContent='Remove';
  remove.setAttribute('aria-label','Remove '+p.title+' from cart');
  remove.addEventListener('click',()=>{cartIds.delete(id);renderCart();render();});
  line.append(details,remove);list.append(line);
 }
 if(!cartIds.size){
  const empty=document.createElement('p');empty.textContent='Your cart is empty.';
  list.append(empty);
 }
 document.getElementById('cartTotal').textContent='Subtotal: '+dollars(total);
 document.getElementById('cartCheckout').disabled=!cartIds.size||checkoutBusy;
}
function addToCart(photo){
 if(!canPurchase(photo))return;
 if(cartIds.size>=10&&!cartIds.has(photo.id)){
  document.getElementById('cartMessage').textContent='A maximum of 10 pieces can be checked out at once.';
  cartOpen=true;renderCart();return;
 }
 cartIds.add(photo.id);
 cartOpen=true;
 document.getElementById('cartMessage').textContent='';
 renderCart();render();
}
document.getElementById('openCart').addEventListener('click',()=>{
 cartOpen=!cartOpen;
 renderCart();
});
document.getElementById('cartCheckout').addEventListener('click',async()=>{
 if(checkoutBusy||!cartIds.size)return;
 checkoutBusy=true;renderCart();
 const msg=document.getElementById('cartMessage');
 msg.textContent='Preparing Stripe sandbox checkout…';
 try{
  const config=window.BRIGHT_MOMENTS_SUPABASE||{};
  if(!config.url||!config.publishableKey)throw Error('Store connection is not configured.');
  const request=await fetch(config.url+'/functions/v1/bright-moments-sandbox-checkout',{
   method:'POST',
   headers:{'Content-Type':'application/json','apikey':config.publishableKey},
   body:JSON.stringify({ids:[...cartIds]})
  });
  const result=await request.json().catch(()=>({}));
  if(!request.ok)throw Error(result.error||'Unable to start test checkout.');
  if(result.mode!=='test'||!result.url?.startsWith('https://checkout.stripe.com/'))
   throw Error('Stripe did not return a valid sandbox checkout.');
  window.location.assign(result.url);
 }catch(error){msg.textContent=error.message||'Sandbox checkout unavailable.';}
 finally{checkoutBusy=false;renderCart();}
});
const checkoutReturn=new URLSearchParams(location.search).get('checkout');
if(checkoutReturn==='returned'||checkoutReturn==='cancelled'){
 const notification=document.getElementById('shopReturnMessage');
 notification.hidden=false;
 notification.textContent=checkoutReturn==='returned'
  ?'You returned from Stripe test checkout. Confirm payment status in the Stripe sandbox dashboard; this page does not verify payment.'
  :'Test checkout was cancelled. Nothing was charged.';
}
function render(){
 const shown=products.filter(p=>p.section===section&&p.category===category);
 items.replaceChildren();
 if(!shown.length){
  const empty=document.createElement('p');empty.className='empty';
  empty.textContent=section==='store'?'Store items are coming soon.':'No pieces in this selection yet.';
  items.append(empty);
 }
 for(const p of shown){
  const article=document.createElement('article');article.className='item';
  const photo=document.createElement('div');photo.className='photo';
  const img=document.createElement('img');img.src=p.file;img.alt=p.title;img.loading='lazy';
  photo.append(img);
  const name=document.createElement('h2');name.className='item-title';name.textContent=p.title;
  article.append(photo,name);
  if(section==='store'){
   const price=document.createElement('p');price.className='item-price';
   price.textContent=Number.isSafeInteger(p.priceCents)&&p.priceCents>=50?dollars(p.priceCents):'Price coming soon';
   article.append(price);
   const buy=document.createElement('button');buy.type='button';buy.className='buy';
   buy.disabled=!canPurchase(p);
   buy.textContent=!canPurchase(p)?'Not available':cartIds.has(p.id)?'In cart · Add again?':'Add to cart';
   buy.addEventListener('click',()=>addToCart(p));
   article.append(buy);
  }
  items.append(article);
 }
 renderCart();
}
document.querySelectorAll("[data-section]").forEach(button=>{const change=()=>{section=button.dataset.section;category=categoryNames[0]||null;document.querySelector(".subnav").classList.add("expanded");document.querySelectorAll("[data-section]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.section===section)));document.querySelectorAll("[data-category]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.category===category)));render()};button.addEventListener("mouseenter",change);button.addEventListener("click",change)});document.querySelectorAll("[data-category]").forEach(button=>{const change=()=>{category=button.dataset.category;document.querySelectorAll("[data-category]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.category===category)));render()};button.addEventListener("mouseenter",change);button.addEventListener("click",change)});
const liveGalleryChannel=typeof BroadcastChannel==='function'?new BroadcastChannel('bright-moments-gallery'):null;
let galleryReloadTask=null;
function queueGalleryReload(){
 if(galleryReloadTask!==null)return;
 galleryReloadTask=setTimeout(()=>{galleryReloadTask=null;loadProducts()},150);
}
liveGalleryChannel?.addEventListener('message',event=>{
 if(event.data?.type==='gallery-changed')queueGalleryReload();
});
window.addEventListener('storage',event=>{
 if(event.key==='bright-moments-gallery-updated-v1')queueGalleryReload();
});
window.addEventListener('focus',queueGalleryReload);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)queueGalleryReload()});
loadProducts();</script></body></html>
