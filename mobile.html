<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bright Moments | Mosaics</title><meta name="description" content="Bright Moments mosaic store and gallery"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet"><style>:root{--ink:#494846;--rose:#e9a4a9;--coral:#f2a277;--sun:#f2d36b;--sage:#b6d6a0;--lilac:#c9b4dc;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:"Bree Serif",Georgia,serif}header{text-align:center;padding:62px 20px 34px}.logo{margin:0;font-size:clamp(2.9rem,8vw,7rem);font-family:"Bree Serif",Georgia,serif;letter-spacing:-.025em;line-height:1.08;font-weight:400;text-transform:none;color:#494846}.subtitle{color:#494846;margin:15px 0 0;text-transform:uppercase;letter-spacing:.16em;font-size:15px;font-weight:400}.brand-banner{max-width:960px;margin:30px auto 0}.brand-banner img{display:block;width:100%;height:auto;object-fit:contain}main{max-width:1350px;margin:auto;padding:0 30px 100px}.tabs{display:flex;justify-content:center;width:max-content;max-width:100%;margin-left:auto;margin-right:auto}.tabs button{border:0;border-radius:0;cursor:pointer;color:#fff;font-weight:700;transition:filter .12s}.tabs button:hover{filter:brightness(.96)}.tabs button:focus-visible{outline:3px solid #292525;outline-offset:3px}.tabs button[aria-selected=true]{box-shadow:inset 0 -4px 0 #342d2a}.primary{margin-top:15px}.primary button{font-size:19px;min-width:230px;padding:18px 30px}.primary [data-section=store]{background:var(--rose)}.primary [data-section=gallery]{background:var(--sun)}.secondary{margin-top:0;margin-bottom:40px}.secondary button{font-size:11px;letter-spacing:.1em;text-transform:uppercase;min-width:110px;padding:13px 18px}.secondary [data-category=all]{background:var(--sage)}.secondary [data-category=art]{background:var(--coral)}.secondary [data-category=coasters]{background:var(--lilac)}.secondary [data-category=mirrors]{background:var(--rose)}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:45px 22px}.item{min-width:0}.photo{width:100%;background:#fff;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5}.photo img{width:100%;height:100%;object-fit:contain;display:block}.item-title{font-size:15px;font-weight:700;margin:13px 0 0}.item-type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#494846;margin:6px 0 0}.buy{display:block;width:100%;margin-top:13px;padding:14px;background:#302c2b;color:#fff;border:0;font-weight:700;cursor:pointer}.buy:hover{background:#a54e58}.empty{text-align:center;grid-column:1/-1;padding:65px 15px;color:#494846;font-size:15px}footer{text-align:center;padding:25px;color:#494846;text-transform:uppercase;letter-spacing:.14em;font-size:10px}@media(max-width:800px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.primary button{min-width:160px}}.logo{font-size:clamp(2.2rem,9vw,4.5rem)}header{padding:40px 14px 30px}main{padding:0 18px 70px}.desktop-nav{display:none}.mobile-selects{display:grid;gap:12px;margin:0 0 28px}.mobile-selects label[hidden]{display:none}.mobile-selects label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mobile-selects select{display:block;width:100%;margin-top:8px;padding:15px 13px;border:1px solid #6e5b55;border-radius:0;background:#fff;font:600 16px Arial, sans-serif;color:#302c2b}.items{display:flex;flex-direction:column;gap:34px}.photo{aspect-ratio:auto;min-height:0;background:#fff}.photo img{width:100%;height:auto;object-fit:contain}.item-title{margin-top:12px}.empty{padding:60px 5px}</style></head><body><header><h1 class="logo">Bright Moments Mosaics</h1><p class="subtitle">Mosaic art &amp; objects</p><div class="brand-banner"><img src="IMG_20211122_100303096.jpg" alt="Bright Moments mosaic banner"></div></header><main><div class="mobile-selects"><label for="sectionSelect">View<select id="sectionSelect"><option value="gallery">Gallery</option><option value="store">Store</option></select></label><label for="categorySelect">Category<select id="categorySelect"><option value="all">All</option><option value="art">Art</option><option value="coasters">Coasters</option><option value="mirrors">Mirrors</option><option value="jewelry">Jewelry</option></select></label></div><section id="items" class="items" aria-label="Mosaics"></section></main><footer>Bright Moments · Handmade mosaics</footer><script>let products=[];
const repoTree="https://api.github.com/repos/sdot61/bright-moments/git/trees/main?recursive=1";
const categoryNames=["art","coasters","mirrors","jewelry"];
async function loadProducts(){try{const response=await fetch(repoTree,{headers:{Accept:"application/vnd.github+json"}});if(!response.ok)throw Error("Repository listing unavailable");const data=await response.json();if(data.truncated)throw Error("Repository listing incomplete");products=(data.tree||[]).filter(f=>f.type==="blob"&&f.size>100&&/\.(jpe?g|png|webp|gif|avif)$/i.test(f.path)).map(f=>{const parts=f.path.split("/");if(parts.length<3)return null;const section=parts[0].toLowerCase();const category=parts[1].toLowerCase();if(!["gallery","store"].includes(section)||!categoryNames.includes(category))return null;const filename=parts[parts.length-1];const era=parts.slice(2,-1).some(x=>x.toLowerCase()==="new")?"new":"older";return {file:parts.map(encodeURIComponent).join("/"),title:filename.replace(/\.[^.]+$/,"").replace(/[_-]+/g," "),category,section,era}}).filter(Boolean);render()}catch(e){console.warn("Could not load repository images",e);items.replaceChildren();const p=document.createElement("p");p.className="empty";p.textContent="Images could not be loaded. Please refresh the page.";items.append(p)}}
const items=document.getElementById("items");let section="gallery",category="all";
function render(){const shown=products.filter(p=>p.section===section&&(category==="all"||p.category===category));items.replaceChildren();if(!shown.length){const empty=document.createElement("p");empty.className="empty";empty.textContent=section==="store"?"Store items are coming soon.":"No pieces in this selection yet.";items.append(empty);return}for(const p of shown){const article=document.createElement("article");article.className="item";const photo=document.createElement("div");photo.className="photo";const img=document.createElement("img");img.src=p.file;img.alt=p.title;img.loading="lazy";photo.append(img);const name=document.createElement("h2");name.className="item-title";name.textContent=p.title;article.append(photo,name);if(section==="store"){const buy=document.createElement("button");buy.className="buy";buy.textContent="Price TBC · Buy";buy.addEventListener("click",()=>alert("Checkout is not available yet."));article.append(buy)}items.append(article)}}document.getElementById("sectionSelect").addEventListener("change",e=>{section=e.target.value;category="all";document.getElementById("categorySelect").value="all";render()});document.getElementById("categorySelect").addEventListener("change",e=>{category=e.target.value;render()});loadProducts();</script></body></html>
