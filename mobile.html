<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bright Moments | Mosaics</title><meta name="description" content="Bright Moments mosaic store and gallery"><style>:root{--ink:#302c2b;--rose:#e9a4a9;--coral:#f2a277;--sun:#f2d36b;--sage:#b6d6a0;--lilac:#c9b4dc;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{text-align:center;padding:62px 20px 34px}.logo{margin:0;font-size:clamp(3.2rem,9vw,8rem);font-family:Arial Black,Arial,sans-serif;letter-spacing:-.075em;line-height:1;font-weight:900;text-transform:lowercase}.subtitle{margin:15px 0 0;text-transform:uppercase;letter-spacing:.26em;font-size:11px;font-weight:700}main{max-width:1350px;margin:auto;padding:0 30px 100px}.tabs{display:flex;justify-content:center;width:max-content;max-width:100%;margin-left:auto;margin-right:auto}.tabs button{border:0;border-radius:0;cursor:pointer;color:#292525;font-weight:700;transition:filter .12s}.tabs button:hover{filter:brightness(.96)}.tabs button:focus-visible{outline:3px solid #292525;outline-offset:3px}.tabs button[aria-selected=true]{box-shadow:inset 0 -4px 0 #342d2a}.primary{margin-top:15px}.primary button{font-size:19px;min-width:230px;padding:18px 30px}.primary [data-section=store]{background:var(--rose)}.primary [data-section=gallery]{background:var(--sun)}.secondary{margin-top:0;margin-bottom:40px}.secondary button{font-size:11px;letter-spacing:.1em;text-transform:uppercase;min-width:110px;padding:13px 18px}.secondary [data-category=all]{background:var(--sage)}.secondary [data-category=art]{background:var(--coral)}.secondary [data-category=coasters]{background:var(--lilac)}.secondary [data-category=mirrors]{background:var(--rose)}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:45px 22px}.item{min-width:0}.photo{width:100%;background:#faf8f5;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5}.photo img{width:100%;height:100%;object-fit:contain;display:block}.item-title{font-size:13px;font-weight:700;margin:13px 0 0}.item-type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#716966;margin:6px 0 0}.buy{display:block;width:100%;margin-top:13px;padding:14px;background:#302c2b;color:#fff;border:0;font-weight:700;cursor:pointer}.buy:hover{background:#a54e58}.empty{text-align:center;grid-column:1/-1;padding:65px 15px;color:#655b58;font-size:15px}footer{text-align:center;padding:25px;color:#776c67;text-transform:uppercase;letter-spacing:.14em;font-size:10px}@media(max-width:800px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.primary button{min-width:160px}}.logo{font-size:clamp(2.7rem,12vw,5rem)}header{padding:40px 14px 30px}main{padding:0 18px 70px}.desktop-nav{display:none}.mobile-selects{display:grid;gap:12px;margin:0 0 28px}.mobile-selects label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mobile-selects select{display:block;width:100%;margin-top:8px;padding:15px 13px;border:1px solid #6e5b55;border-radius:0;background:#fff;font:600 16px Arial, sans-serif;color:#302c2b}.items{display:flex;flex-direction:column;gap:34px}.photo{aspect-ratio:auto;min-height:0;background:#fff}.photo img{width:100%;height:auto;object-fit:contain}.item-title{margin-top:12px}.empty{padding:60px 5px}</style></head><body><header><h1 class="logo">bright moments</h1><p class="subtitle">Mosaic art &amp; objects</p></header><main><div class="mobile-selects"><label for="sectionSelect">View<select id="sectionSelect"><option value="gallery">Gallery</option><option value="store">Store</option></select></label><label for="categorySelect">Category<select id="categorySelect"><option value="all">All</option><option value="art">Art</option><option value="coasters">Coasters</option><option value="mirrors">Mirrors</option></select></label></div><section id="items" class="items" aria-label="Mosaics"></section></main><footer>Bright Moments · Handmade mosaics</footer><script>const products=[{file:"IMG_9429.JPG",title:"Mosaic Artwork 01",category:"art",section:"gallery"},{file:"IMG_9430.JPG",title:"Mosaic Artwork 02",category:"art",section:"gallery"},{file:"IMG_9431.JPG",title:"Mosaic Mirror",category:"mirrors",section:"gallery"}];
const items=document.getElementById("items");let section="gallery",category="all";
function render(){const shown=products.filter(p=>p.section===section&&(category==="all"||p.category===category));items.replaceChildren();if(!shown.length){const empty=document.createElement("p");empty.className="empty";empty.textContent=section==="store"?"Store items are coming soon.":"No pieces in this category yet.";items.append(empty);return}for(const p of shown){const article=document.createElement("article");article.className="item";const photo=document.createElement("div");photo.className="photo";const img=document.createElement("img");img.src=p.file;img.alt=p.title;img.loading="lazy";photo.append(img);const name=document.createElement("h2");name.className="item-title";name.textContent=p.title;article.append(photo,name);if(section==="store"){const buy=document.createElement("button");buy.className="buy";buy.textContent="Price TBC · Buy";buy.addEventListener("click",()=>alert("Checkout is not available yet."));article.append(buy)}items.append(article)}}document.getElementById("sectionSelect").addEventListener("change",e=>{section=e.target.value;category="all";document.getElementById("categorySelect").value="all";render()});document.getElementById("categorySelect").addEventListener("change",e=>{category=e.target.value;render()});render();</script></body></html>
